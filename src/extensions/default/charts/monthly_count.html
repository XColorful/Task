<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Monthly Count</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>body{margin:0;background:#1e1e1e;color:#ccc;font-family:sans-serif}
#chart{width:100vw;height:100vh}</style></head><body>
<div id="chart"></div>
<script>
var c = echarts.init(document.getElementById('chart'));
fetch('/api/analysis/monthly_count').then(r=>r.json()).then(d=>{
  c.setOption({title:{text:'Monthly Task Count',textStyle:{color:'#ccc'}},
    tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:d.labels,axisLabel:{color:'#ccc'}},
    yAxis:{type:'value',axisLabel:{color:'#ccc'}},
    series:[{type:'line',data:d.values,smooth:true,areaStyle:{}},
            {type:'bar',data:d.values}]
  });
});
</script></body></html>
