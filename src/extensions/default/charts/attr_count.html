<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Attribute Count</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>body{margin:0;background:#1e1e1e;color:#ccc;font-family:sans-serif}
#chart{width:100vw;height:100vh}</style></head><body>
<div id="chart"></div>
<script>
var c = echarts.init(document.getElementById('chart'));
fetch('/api/analysis/attr_count').then(r=>r.json()).then(d=>{
  c.setOption({title:{text:'Attribute Distribution',textStyle:{color:'#ccc'}},
    tooltip:{trigger:'item'},
    series:[{type:'pie',radius:'60%',data:d.labels.map((l,i)=>({name:l,value:d.values[i]}))},
            {type:'bar',data:d.values,xAxisIndex:0,yAxisIndex:1}],
    xAxis:[{},{type:'value'}],
    yAxis:[{},{type:'category',data:d.labels}],
    grid:[{},{left:'55%'}]
  });
});
</script></body></html>
